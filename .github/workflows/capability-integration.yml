name: Capability integration

on:
  push:
    branches: [main]
    paths: ['internal/semantic/**', 'internal/sourceproof/**', 'internal/jobrun/**', 'go.mod', 'go.sum', '.github/workflows/capability-integration.yml']
  pull_request:
    paths: ['internal/semantic/**', 'internal/sourceproof/**', 'internal/jobrun/**', 'go.mod', 'go.sum', '.github/workflows/capability-integration.yml']

permissions:
  contents: read

jobs:
  real-provider:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build explicit test provider
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/agentdock-providers"
          GOBIN="$RUNNER_TEMP/agentdock-providers" go install golang.org/x/tools/gopls@v0.23.0
      - name: Real gopls and independent execution lifecycle
        shell: bash
        run: |
          AGENTDOCK_TEST_GOPLS="$RUNNER_TEMP/agentdock-providers/gopls" \
            go test -race ./internal/semantic ./internal/jobrun ./internal/sourceproof -count=1 -timeout=3m -v
